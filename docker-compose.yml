# ==============================================================
# HIS 诊所管理系统 - Docker Compose 配置
# 普通用户使用：git clone 后直接 docker-compose up -d 即可启动
# ==============================================================

services:
  # Nginx Web 服务器
  nginx:
    image: registry.cn-hangzhou.aliyuncs.com/yiliaocrm/nginx:1.28.3-alpine
    container_name: his-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - his_network
    restart: unless-stopped

  # PHP-FPM 应用容器（使用阿里云预构建镜像）
  app:
    image: registry.cn-hangzhou.aliyuncs.com/yiliaocrm/his:latest
    platform: linux/amd64
    container_name: his-app
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor  # 保护镜像内预装的 vendor 目录，防止宿主机空目录覆盖
      - ./storage:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=saas
      - DB_USERNAME=root
      - DB_PASSWORD=123456
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - his_network
    restart: unless-stopped

  # MySQL 数据库
  mysql:
    image: registry.cn-hangzhou.aliyuncs.com/yiliaocrm/mysql:8.0.45-debian
    container_name: his-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=saas
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 使用 CMD-SHELL 确保密码参数正确解析
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - his_network
    restart: unless-stopped

  # Redis 缓存与队列
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/yiliaocrm/redis:7.4.9-alpine3.21
    container_name: his-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - his_network
    restart: unless-stopped

networks:
  his_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  vendor_data:
